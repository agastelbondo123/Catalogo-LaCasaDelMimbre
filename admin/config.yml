backend:
  name: git-gateway
  repo: agastelbondo123/Catalogo-LaCasaDelMimbre
  branch: main

media_folder: "imagenes"
public_folder: "imagenes"

collections:
  - name: "productos"
    label: "Productos"
    files:
      - name: "catalogo"
        label: "Catálogo de productos"
        file: "data/productos.json"
        fields:
          - label: "Productos"
            name: "productos"
            widget: "list"
            summary: "{{nombre}} — {{categoria}}"
            fields:
              - {label: "Nombre del producto", name: "nombre", widget: "string"}
              - {label: "Foto", name: "imagen", widget: "image"}
              - {label: "Descripción", name: "descripcion", widget: "text"}
              - {label: "Precio", name: "precio", widget: "string", hint: "Escribe el precio así: $180.000"}
              - label: "Página"
                name: "pagina"
                widget: "select"
                options:
                  - {label: "Casas", value: "casas"}
                  - {label: "Restaurantes", value: "restaurantes"}
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options:
                  - {label: "Cuarto", value: "cuarto"}
                  - {label: "Cocina", value: "cocina"}
                  - {label: "Sala", value: "sala"}
                  - {label: "Terraza", value: "terraza"}
                  - {label: "Muebles (restaurante)", value: "muebles"}
                  - {label: "Decoración (restaurante)", value: "decoracion"}
